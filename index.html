<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#120d24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Party Box" />
    <meta name="description" content="Party games for one phone and a loud room" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Party Box</title>
    <script>
      // Puts the saved colour scheme and display choices on <html> before the first paint;
      // applyTheme() and applyDisplay() take over once the app loads. Anything unknown is Normal,
      // and a screen read from across the room (the pattern in src/lib/farRead.ts) keeps Normal text.
      (function () {
        var root = document.documentElement, s = {};
        try { s = JSON.parse(localStorage.getItem('hr:settings') || '{}'); } catch (e) {}
        if (!s || typeof s !== 'object') s = {};
        var path = location.hash.replace(/^#/, '').split('?')[0] || '/';
        var far = /^\/(?:[a-z0-9]+\/host|quiz\/play|forehead\/play)(?:\/|$)/.test(path);
        root.dataset.text = !far && (s.textSize === 'small' || s.textSize === 'large') ? s.textSize : 'normal';
        root.dataset.density = s.spacing === 'compact' ? 'compact' : 'normal';
        try {
          var t = s.theme || 'dark';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          root.dataset.theme = t === 'light' ? 'light' : 'dark';
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f3fa');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Paint the background before any JS or CSS bundle, in the chosen scheme (match --bg in tokens.css). */
      html, body { background: #120d24; margin: 0; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f5f3fa; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
